name: keepalive

# Supabase's free tier pauses a project after a week without database activity, and a
# quiet week between friends' questions is normal. Closing a made-up session runs one
# DELETE against the conversations table: free, no model call, nothing logged as a question.

on:
  schedule:
    - cron: "17 15 */2 * *"
  workflow_dispatch:

jobs:
  touch-database:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST --retry 3 --max-time 120 https://fantasy-fanatic-487070873858.us-central1.run.app/sessions/keepalive/close
