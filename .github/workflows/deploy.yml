name: deploy

# CD, gated on CI. Replaces the console-created Cloud Build trigger, which deployed on
# every push to main regardless of whether tests passed - CI and CD ran independently,
# so a broken push still shipped.
#
# Authenticates via Workload Identity Federation, not a service account JSON key. No
# long-lived credential is stored in GitHub secrets: each run exchanges GitHub's OIDC
# token for a short-lived GCP token. The pool's attribute-condition restricts that
# exchange to this repository - without it any GitHub repo could impersonate the
# deployer service account.

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]

env:
  PROJECT_ID: fantasy-fanatic
  REGION: us-central1
  SERVICE: fantasy-fanatic

# Two pushes close together deploy once, not twice: the later run cancels the earlier
# build rather than both shipping in sequence.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    # The gate: workflow_run fires on failure too, so this must be checked explicitly.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Declaring an environment is what makes GitHub record a Deployment object per run -
    # without it the repo's Deployments panel stays empty no matter what actually shipped.
    # The url is the bare service origin; the friends key never goes here (public repo).
    environment:
      name: production
      url: https://fantasy-fanatic-487070873858.us-central1.run.app
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for WIF

    steps:
      # Check out the exact commit that passed tests, not whatever main is now - they
      # can differ if something landed while the test run was in flight.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/487070873858/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@fantasy-fanatic.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # The service is public and the app-level key is the gate - deploying with the
      # secret unset would ship an ungated public endpoint, so refuse instead.
      - name: Refuse to deploy public without the link key
        run: |
          if [ -z "${{ secrets.FF_LINK_KEY }}" ]; then
            echo "FF_LINK_KEY repo secret is not set - add it (Settings -> Secrets and"
            echo "variables -> Actions) before deploying a public service."
            exit 1
          fi

      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 600 \
            --concurrency 12 \
            --max-instances 3 \
            --session-affinity \
            --execution-environment gen2 \
            --cpu-boost \
            --service-account "fantasy-fanatic-run@fantasy-fanatic.iam.gserviceaccount.com" \
            --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,DATABASE_URL=database-url:latest" \
            --set-env-vars "^;^FF_LINK_KEY=${{ secrets.FF_LINK_KEY }};DAILY_BUDGET_USD=10.00;DAILY_MAX_REQUESTS=300;WARM_LEAGUES=1315386978904084480,1319727865188593664,1313999558660857856,1354169522327670784;DEMO_BUDGET_USD=3.00;DEMO_ASKS_PER_VISITOR=10;DEMO_LEAGUE=1315386978904084480"

      # The settings above are load-bearing and easy to lose in a console edit, so they
      # are declared here rather than living only as click-state:
      #   max-instances 3             - more than one since conversations and the daily caps
      #                                 moved to Postgres (agent/db.py); each extra instance
      #                                 is billed only while it serves
      #   session-affinity            - a browser stays on one instance, because answer
      #                                 progress and the dropped-connection reclaim
      #                                 (api.py _progress / _answers) are per instance
      #   concurrency 12              - a cold page load fires 8-12 requests at once and
      #                                 Cloud Run holds only this many while the instance
      #                                 boots; at 2 (and at 5) the rest were turned away,
      #                                 owner's asks included (staging test, 2026-10-21:
      #                                 2 -> 2-4 of 12 through, 5 -> 5, 12 -> 12). Five
      #                                 asks at once peaked at 2.6Gi (~0.45Gi per run).
      #   cpu 2                       - starting chat processes saturated 1 CPU: of six new
      #                                 asks at once, Cloud Run turned four away (2026-11-04).
      #                                 Billed only while active, so it costs very little.
      #   memory 2Gi                  - one process and one data cache now that chats hold no
      #                                 subprocesses: ten chats at once on staging peaked at
      #                                 0.57Gi (2026-11-06); 4Gi was for four CLI+MCP pairs
      #   gen2                        - the second-generation runtime, full Linux compatibility
      #   allow-unauthenticated       - the service is public; what gates real use is
      #                                 FF_LINK_KEY (app-level, checked on /ask and
      #                                 /api/*) plus the daily budget that fails closed.
      #                                 If this flag errors on deploy the deployer SA
      #                                 lacks run.services.setIamPolicy - grant
      #                                 roles/run.admin to github-deployer, or set the
      #                                 allUsers invoker binding once in the console
      #   FF_LINK_KEY                 - the friends-link key, a GitHub Actions secret
      #                                 (repo Settings -> Secrets -> Actions); rotating
      #                                 it is changing the secret and re-deploying
      #   DAILY_BUDGET_USD            - $10/day (~110-250 questions), raised from $3 when
      #   DAILY_MAX_REQUESTS            the first group session nearly hit the ceiling;
      #                                 the request count is the backstop for calls that
      #                                 report no cost. This is the whole exposure if the
      #                                 link key ever leaks - a deliberate number
      #   WARM_LEAGUES                - league ids pre-fetched in a background thread on
      #                                 container start (the four leagues friends use), so
      #                                 a visit after Cloud Run scaled to zero doesn't pay
      #                                 ~10s of cold fetches. The `^;^` prefix makes `;`
      #                                 the pair delimiter so the id list can use commas
      #   DATABASE_URL                - conversations and the daily caps in Supabase Postgres
      #                                 (agent/db.py; the database-url
      #                                 secret, the transaction pooler's connection string)
      #   service-account             - a dedicated runtime identity holding exactly two
      #                                 permissions (read the anthropic-api-key and
      #                                 database-url secrets),
      #                                 not the default compute account, which carries
      #                                 project Editor. A compromised deploy can still
      #                                 reach those secrets - unavoidable when the code
      #                                 needs it to run - but no longer inherits the
      #                                 whole project along with it.
