<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fantasy-fanatic</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --panel:#171a21; --ink:#e6e8ee; --muted:#98a2b3; --accent:#4ade80; --line:#262b36; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; letter-spacing:.2px; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:820px; margin:0 auto; padding:18px; }
  #log { display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .msg { padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { background:#1d2430; border-color:#2b3444; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
  button { padding:11px 16px; border-radius:9px; border:1px solid var(--line); background:var(--accent); color:#06240f; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .examples { margin:10px 0 0; display:flex; gap:8px; flex-wrap:wrap; }
  .examples button { background:transparent; color:var(--muted); font-weight:400; font-size:13px; padding:6px 10px; }
  .warn { color:#fbbf24; }
</style>
</head>
<body>
<header>
  <h1>fantasy-fanatic</h1>
  <span class="sub">dynasty analysis · answers come from real Sleeper + FantasyCalc data</span>
</header>
<main>
  <div id="log"></div>
  <form id="f">
    <input id="q" type="text" autocomplete="off" placeholder="e.g. For Sleeper league &lt;id&gt;, what should &lt;owner&gt; do?" required>
    <button id="send" type="submit">Ask</button>
  </form>
  <div class="examples">
    <button type="button" data-fill="For Sleeper league 1315386978904084480, what team window is dezdroppedit27 in and why?">example: team window</button>
    <button type="button" data-fill="Who should rjl22 target in a trade?">example: follow-up (tests memory)</button>
    <button type="button" id="reset">new conversation</button>
  </div>
</main>
<script>
// Session id is generated client-side and kept in sessionStorage. The server never
// issues one, so a lost/expired session simply starts a new conversation rather than
// erroring - and one browser tab's conversation is never reachable from another.
function newSession() { return crypto.randomUUID(); }
let sessionId = sessionStorage.getItem("ff_session") || newSession();
sessionStorage.setItem("ff_session", sessionId);

const log = document.getElementById("log");
const form = document.getElementById("f");
const input = document.getElementById("q");
const send = document.getElementById("send");

function add(text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + (cls || "");
  el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

document.querySelectorAll("[data-fill]").forEach(b =>
  b.onclick = () => { input.value = b.dataset.fill; input.focus(); });

document.getElementById("reset").onclick = () => {
  sessionId = newSession();
  sessionStorage.setItem("ff_session", sessionId);
  log.innerHTML = "";
  add("Started a new conversation.", "");
};

form.onsubmit = async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  add(question, "me");
  // First request after idle can be slow: container cold start plus uncached
  // FantasyCalc/nflverse pulls. Say so rather than looking hung.
  const pending = add("thinking… (first question after a while can take ~30-60s)", "");
  send.disabled = true;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId }),
    });
    const data = await res.json();
    pending.textContent = data.text || "(no answer)";
    const bits = [];
    if (data.cost_usd != null) bits.push("$" + data.cost_usd.toFixed(4));
    if (data.num_turns != null) bits.push(data.num_turns + " turns");
    if (data.grounding_retries) bits.push(data.grounding_retries + " grounding retry");
    if (data.budget_exhausted) bits.push("daily budget reached");
    if (bits.length) {
      const meta = document.createElement("div");
      meta.className = "meta" + (data.budget_exhausted ? " warn" : "");
      meta.textContent = bits.join(" · ");
      pending.appendChild(meta);
    }
  } catch (err) {
    pending.textContent = "Request failed: " + err;
  } finally {
    send.disabled = false;
    input.focus();
  }
};
</script>
</body>
</html>
